# Per-cave settings for the tools (sketch2therion, layout, review, web,
# CI). One cave for now; another cave gets its own copy of this file
# (see tools/README.md). Paths are relative to the top of the repository.

[cave]
name = "LongwoodValleySink"
title = "Longwood Valley Sink"
folder = "LongwoodValleySink"
master = "LongwoodValleySink/LongwoodValleySink.th"   # sources every survey
survey = "LongwoodValleySink"                          # its top-level survey
thconfig = "LongwoodValleySink/Plan_only.thcfg"        # the trial build
check_build = "LongwoodValleySink/Whole_cave.thcfg"   # plan, extended and 315 of the whole cave, after every run
plan_map = "LongwoodValleySinkMP"                      # the cave's plan map,
plan_map_file = "LongwoodValleySink/LongwoodValleySink.th"   # defined here (group maps are in Maps.th)

[names]
# {survey} is a survey's name, e.g. GoSouth (see tools/Style.md).
survey_file = "{survey}/{survey}.th"
plan_file = "{survey}/{survey}.plan.th2"
scrap_prefix = "{survey}S"          # the converter adds P1, P2, ... (plan) or E1, ... (elevation)
survey_plan_map = "{survey}MP"
plan_sketch = '(\.plan|_p|P)\.xvi$'   # regex: which .xvi sketches are plans (the rest are elevations)

[drawing]
line_endings = "lf"                 # "lf" or "crlf", for .th2 files the tools write
map_scale = 500
licence = "CC BY-NC-SA 4.0"         # survey data and drawings; the tools are GPLv3

[convert]
# How tools/sketch2therion reads this cave's sketches (defaults, and what
# each means: tools/sketch2therion/settings.py). Colours: black walls;
# brown boulders, debris (closed loops, told apart by size), sand (dots),
# mud (dashes); grey and other lines inside the passage are steps or
# ledges, drawn as borders; blue water; green flowstone and pretties,
# solid green lines gours. Colours are hints: the notation (ticks,
# dashes) decides steps, pitches and overhangs.
wall_colours = ["BLACK"]
elevation_wall_colours = ["BLACK", "BROWN", "GREEN"]   # in elevations the floor is often drawn brown or green ...
auto_scraps = true          # scraps from the 3D model where none are listed below (log row 133)
section_names = true        # cross-sections named FairyChimneysPX5 (log row 125)
outer_walls = true          # every outer line is a wall: passage on one side only, by the splays (log row 125)
dashed_presumed = true      # black dashed lines are wall -subtype presumed (log row 125)
section_arrows = true       # cross-section lines with arrows (Style.md, Cross-sections)
layout_split = false        # never split or flip a drawing to fit where Therion puts the stations today (plan 5d)
elevation_features = true   # elevations: pools, water flow, curtains, blocks, rocks, rubble, by shape
wall_subtypes = true        # ... and is then mud (wall -subtype clay), sand (brown dots along it) or, green, flowstone (smooth) or blocks (lumpy, rock on the floor)
interior_borders = true
brown = "floor"
boulder_min = 0.3           # m: a closed loop this wide or wider is a boulder
wall_jog_max = 0.4
pool_min_area = 0.05
pools_first = true
climb_whole = true
notation = true             # ticked lines: steps/pitches; dashed with ticks: overhangs
elevation_data = false      # draw only what the plan sketch shows: nothing inferred from the elevation
gours = true                # solid green lines
water_to_walls = false      # pools keep their sketched outline
area_marks = true           # groups of boulders/debris as areas, isolated boulders alone
one_rock_edge = true
smooth_lines = true
end_on_node = true
boulder_over_wall = 0.1     # m: a boulder at a wall just crosses it, without growing
mark_max = 0.15             # m: smaller marks are dirt: ignored alone, sand or mud in groups
area_min_width = 0.5        # m: areas need room for their symbols: thinner parts dropped
area_min_area = 0.4         # m2
area_over_walls = 0.15      # m: areas run just over the walls, which clip them (no more: it makes odd shapes)
area_splines = 0.25         # m: area outlines simplified to this, drawn as splines (few nodes)
green_loops = true          # a single green loop is a boulder or debris (the colour was wrong)
corner_cone = 60            # degrees: at a corner the passage's leg is off to one side of the wall
area_lines = false          # brown lines inside boulder/debris areas are part of the rocks: dropped
presumed_walls = false      # no presumed walls where nothing was sketched: gaps left open for Therion
notation_rel = 2.2          # m: ticks and dashes scale with the legs' length over this (Trident's are drawn bigger)
tick_reach = 0.35           # m: ticks drawn a little clear of their line still mark it a step
chain_gap = 1.0             # m: brown line strokes this close end to end, carrying on, are one line
mud_ticks = 1.5             # m: a brown line's brown ticks among many mud dashes are mud, not a step
brown_ticks = false         # brown short strokes are mud or rocks, never the ticks of a step
dash_max = 1.5              # m: brown dashes up to this long (roughly straight) are mud
mud_near = 2.0              # m: mud marks this close are one patch
mud_grow = 0.7              # m: a patch is grown this far round its marks, kept off rocks, sand on it merged in
rock_curves = true          # curved brown strokes are rock outlines
area_grow = 1.0             # m: rock areas grown round their rocks within the passage, up to walls, steps and long lines
barrier_min = 1.5           # m: shorter lines inside the passage do not stop an area, and go among rocks
curls_closed = true         # a brown stroke curled round on itself is a boulder
wall_tol_rel = 0.02         # walls follow the sketch to within this share of the nearby legs' length ...
wall_presmooth = 3          # ... after smoothing out hand wobble over 3 times that (nodes where the wall bends)
rock_faces = true           # the fill is cut along the walls; rock it took in (bends, tongues, hooks) dropped
pockets = true              # a wall piece out beyond the outline with both ends on one wall is a pocket: the wall goes round it
wall_hooks = true           # a small black loop left open at a wall is a hook of the wall, not a boulder
merge_short = 4             # a line of up to 4 nodes meeting another of its kind end to end is merged into it (a sharp join keeps its corner)
ends_meet = true            # lines of different kinds ending close together share the end (border to floor step to pit)
despike = 0.3               # m: a wall turning right back over less than this is an overshoot, not a corner
smooth_nodes = 60           # degrees: control points either side of a node in line, unless it turns more (a corner)
wall_links = 0.4            # m: a piece of wall off the outline, this long or more, joining two outline walls' ends is wall (no hole)
area_inside_min = 0.2       # an area less than this share inside the passage (its marks along a wall) is not drawn
line_tol_rel = 0.02         # borders, steps and overhangs likewise
section_tol_rel = 0.05      # a cross-section's wall to within this share of its size
sections_in_place = true    # a cross-section is drawn where it was sketched, by its section mark
wall_ends_meet = 0.15       # m: wall ends this close meet (not across a leg, and only if the outline stays sound) ...
wall_ends_meet_rel = 0.12   # ... or within this share of the nearby legs' length, if larger
node_gap = 0.05             # m: no two nodes of a line closer than this, so each can be picked when editing ...
node_gap_rel = 0.4         # ... or this share of the nearby legs' length: nodes go wherever the shape allows (flowing curves need few)
hand_scraps = true          # plan scraps from [scraps] below, where a survey has them
join_local = true           # joined walls refitted only near the join, not along their length

[build]
outputs = "LongwoodValleySink/Outputs"   # where the thconfigs write their sheets
log = "output/therion.log"
layout_plan = "output/layout-plan.xvi"
layout_extended = "output/layout-extended.xvi"
sql = "output/layout.sql"
review_plan = "output/review-plan.pdf"

[[sheets]]
file = "LongwoodValleySinkP.pdf"
title = "Plan"
blurb = "The whole cave in plan, rotated 45 degrees. Scale 1:500."

[scraps]
# Plan scraps chosen by hand, where one scrap would join passages that
# overlap in plan (tools/sketch2therion/scraps.py). Stations per scrap;
# a leg between scraps is in neither.
# GoSouth: 15 to 17 drops into the passage beside (19, 18, 20 and on),
# which only comes close to 9 to 11, 8 m below 19, without joining it.
GoSouth = ["1-16", "17-29"]

[scraps_extended]
# The same for extended elevations: where passages overlap in elevation.
# GoSouth: the rift up to 19 rises over the passage from 1 to 8.
# Trident (as the user split it): the ramp to 12; the passage from 13 on
# to 34 and the far end, 36 and 38 to 43; 35 and 37 above it.
GoSouth = ["1-16", "17-29"]
Trident = ["1-12", "13-34, 36, 38-43", "35, 37"]

[glitches]
# Slips of the pen in a sketch: stroke points inside these boxes (sketch
# metres, x0 y0 x1 y1, as `check` and the .xvi give them) are ignored,
# cutting the stroke there. The sketch itself is left as it is. Only for
# a slip the user confirms: a sharp feature is usually real (Trident's
# peak by 37 is, log row 116).
